# Server Configuration
server.port=8081
spring.application.name=notification-service

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/observability_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Disable automatic snake_case conversion - use exact column names
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl

# Handle PostgreSQL enums properly
spring.jpa.properties.hibernate.type.preferred_jdbc_type_for_enum=VARCHAR

# Logging
logging.level.org.springframework=INFO
logging.level.org.observability=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
rabbitmq.exchange.name=observability.events
rabbitmq.exchange.type=topic
rabbitmq.exchange.durable=true

spring.jpa.properties.hibernate.validator.apply_to_ddl=false
spring.jpa.properties.jakarta.persistence.validation.mode=none

logging.level.org.springframework.amqp=DEBUG

